includes:
  - headers/data.yaml
  - headers/device.yaml
  - headers/misc.yaml
  - headers/model.yaml
  - headers/optimizer.yaml
  - classifiers/LDPNet.yaml
  - backbones/resnet10.yaml

device_ids: 0
n_gpu: 1

data_root: D:/datasets/CUB_200_2011_FewShot
image_size: 224
use_memory: False
augment: False
augment_times: 1
augment_times_query: 1
workers: 4
dataloader_num: 1

way_num: 5
shot_num: 1
query_num: 15
episode_size: 1
train_episode: 100
test_episode: 600

test_way: 5
test_shot: 1
test_query: 15

epoch: 50
test_epoch: 5
val_per_epoch: 1
batch_size: 128

pretrain_path: ~
resume: False

backbone:
  name: resnet10
  kwargs:
    list_of_out_dims: [64, 128, 256, 512]
    list_of_stride: [1, 2, 2, 2]
    list_of_dilated_rate: [1, 1, 1, 1]

optimizer:
  name: SGD
  kwargs:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: False
    dampening: 0.0

lr_scheduler:
  name: MultiStepLR
  kwargs:
    milestones: [30, 40]
    gamma: 0.1
